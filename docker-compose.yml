services:
  dev:
    build:
      context: .
      target: dev
      network: host
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      CI: 'true'
    command:
      ['sh', '-c', 'pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0']

  build:
    build:
      context: .
      target: build
      network: host
    command: ['pnpm', 'build']

  preview:
    build:
      context: .
      target: prod
      network: host
    ports:
      - '4321:80'

  test:
    build:
      context: .
      target: test
      network: host
    network_mode: host
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      CI: 'true'
    command: ['pnpm', 'test']

volumes:
  app_node_modules:
